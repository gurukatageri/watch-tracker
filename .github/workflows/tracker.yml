name: Watch Launch Tracker

on:
  schedule:
    - cron: "20 * * * *"          # hourly: check sources, commands, urgent alerts
    - cron: "0 3 * * *"           # daily digest at 07:00 UAE time
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: test
        options: [test, collect, digest, probe]

permissions:
  contents: write

concurrency:
  group: watch-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTFOLIO_PASSPHRASE: ${{ secrets.PORTFOLIO_PASSPHRASE }}
          WATCHCHARTS_API_KEY: ${{ secrets.WATCHCHARTS_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then MODE=digest; else MODE=collect; fi
          fi
          echo "Running in $MODE mode"
          python watch_tracker.py --mode "$MODE"

      - name: Save results
        run: |
          git config user.name "watch-tracker-bot"
          git config user.email "watch-tracker-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Update releases [skip ci]"
            git pull --rebase
            git push
          fi
